<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Sinarmas</title>
    <link rel="stylesheet" href="ForgotPassword.css">
</head>
<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">
        <img src="D:\PT SMART Tbk\Folder gambar\Sinar_mas-removebg-preview.png" alt="Sinarmas Logo" class="logo">
    </div>

    <!-- RIGHT -->
    <div class="right">
        <h1>Who Am i?</h1>

        <div class="input-group">
            <input type="text" id="userId" placeholder="ID">
        </div>

        <div class="input-group">
            <input type="password" id="newPassword" placeholder="New Password">
            <span class="icon" onclick="togglePassword('newPassword')">👁️</span>
        </div>

        <div class="input-group">
            <input type="password" id="confirmPassword" placeholder="Confirm Password">
            <span class="icon" onclick="togglePassword('confirmPassword')">👁️</span>
        </div>

        <button class="change-btn" onclick="changePassword()">Change</button>

        <div class="links">
            <span>Do you have an account?</span>
            <a href="../Login/Login.html">Log in</a>
        </div>
    </div>

</div>

<script src="ForgotPassword.js"></script>
</body>
</html>
